<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Legends">
<title>FOOTBALL LEGENDS | مسابقه شناخت بازیکنان فوتبال</title>
<style>
:root{--night:#070d1c;--deep:#0c1630;--panel:#111d3b;--panel2:#16264a;--line:#25386b;--ink:#eaf1ff;--mute:#90a2c8;--gold:#f2c14e;--gold2:#ffdf8a;--grass:#18a054;--grass2:#0e6b3a;--neon:#2ee6ff;--bad:#ff5470;--ok:#3be08a;--r:18px}
[data-theme=emerald]{--night:#04140d;--deep:#07261a;--panel:#0d3324;--panel2:#12432f;--line:#1d6a49;--mute:#8fc7ad}
[data-theme=royal]{--night:#0a0820;--deep:#15103a;--panel:#1d1650;--panel2:#271e6b;--line:#4a3fa8;--mute:#a79fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Vazirmatn','IRANSans','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--night);color:var(--ink);min-height:100dvh;overflow-x:hidden;line-height:1.6}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--deep),var(--night) 55%,#052a16 100%)}
#bg i{position:absolute;display:block}
.beams{inset:0;background:conic-gradient(from 150deg at 8% -8%,transparent 0 12deg,rgba(255,248,210,.17) 22deg,transparent 34deg),conic-gradient(from 210deg at 92% -8%,transparent 0 12deg,rgba(255,248,210,.17) 22deg,transparent 34deg)}
.crowd{left:0;right:0;top:46%;height:20%;background:radial-gradient(circle at 5px 5px,rgba(255,255,255,.09) 1.6px,transparent 2.2px) 0 0/13px 13px;-webkit-mask:linear-gradient(transparent,#000 40%,transparent);mask:linear-gradient(transparent,#000 40%,transparent)}
.pitch{left:-20%;right:-20%;bottom:-6%;height:34%;background:repeating-linear-gradient(90deg,#0f6b3a 0 46px,#0b5c31 46px 92px);transform:perspective(260px) rotateX(48deg);transform-origin:bottom;opacity:.55;-webkit-mask:linear-gradient(transparent,#000 50%);mask:linear-gradient(transparent,#000 50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.shell{max-width:540px;margin:0 auto;padding:0 14px 110px}
#top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:10px 14px;background:linear-gradient(180deg,rgba(7,13,28,.96),rgba(7,13,28,.78));backdrop-filter:blur(8px)}
.tb{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:11.5px}
.xpb{height:5px;border-radius:5px;background:#1b2b56;margin-top:3px;overflow:hidden}.xpb u{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--neon));border-radius:5px}
.cur{display:flex;flex-direction:column;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:1px 10px;font-weight:800;font-size:13px}
.ic{width:15px;height:15px;display:inline-block}
.ic.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#b07d12);box-shadow:inset 0 0 0 2px rgba(120,80,0,.4)}
.ic.gem{background:linear-gradient(135deg,#bff6ff,var(--neon) 55%,#168aa3);transform:rotate(45deg) scale(.8);border-radius:3px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,#46598f,#25386b) border-box;border:3px solid transparent}
.av img{width:100%;height:100%;object-fit:cover}
.av.f-gold{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,#fff0a8,#d9a014,#fff0a8) border-box}
.av.f-neon{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,#2ee6ff,#3a63ff) border-box;box-shadow:0 0 12px #2ee6ff88}
.av.f-flame{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,#ff3d3d,#ffb03a,#ff3d3d) border-box;box-shadow:0 0 12px #ff7a3a88}
.av.big{width:92px;height:92px;font-size:50px;border-width:4px}
.hero{text-align:center;padding:14px 0 6px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.95;direction:ltr;font-family:Impact,'Arial Black','Haettenschweiler',sans-serif;font-style:italic;text-transform:uppercase}
.logo span{font-size:25px;letter-spacing:7px;color:var(--neon);text-shadow:0 0 14px #2ee6ff77}
.logo b{font-size:50px;background:linear-gradient(180deg,#fff6c9,var(--gold) 55%,#b57e14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3d05)}
.logo small{direction:rtl;font-style:normal;font-family:inherit;text-transform:none;letter-spacing:0;color:var(--mute);font-size:13px;margin-top:6px}
.heroCard{width:176px;margin:16px auto 6px;transform:rotate(-5deg);cursor:pointer;filter:drop-shadow(0 18px 24px #000a)}
.cta{display:block;width:100%;padding:14px;border-radius:16px;font-weight:900;font-size:19px;color:#1b1400;background:linear-gradient(180deg,#ffe38f,var(--gold) 60%,#c58d14);box-shadow:0 5px 0 #7a5409,0 12px 24px #f2c14e33;position:relative;overflow:hidden}
.cta small{display:block;font-size:12.5px;font-weight:700;opacity:.75}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5409}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.cta.alt{background:linear-gradient(180deg,#34d77b,var(--grass) 60%,var(--grass2));color:#02170b;box-shadow:0 5px 0 #08431f}
.cta.alt::after,.cta.sm::after{display:none}
.cta.sm{padding:10px;font-size:15px;border-radius:13px}
.ghost{width:100%;padding:11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{position:relative;text-align:right;padding:14px 12px;border-radius:var(--r);background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-height:86px}
.tile:active{transform:scale(.97)}
.tile em{font-style:normal;font-size:26px;line-height:1}.tile b{font-size:15px}.tile small{color:var(--mute);font-size:11.5px}
.dot{position:absolute;top:10px;left:10px;width:11px;height:11px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px #ff547033}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0 12px}.bar h2{margin:0;font-size:20px;flex:1}
.back{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:22px}
h3{margin:18px 0 8px;font-size:16px}
.card2{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:11.5px;font-weight:800;background:#ffffff14;border:1px solid #ffffff22}
.pill.gold{background:#f2c14e22;border-color:#f2c14e66;color:var(--gold2)}
.bn{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.bn div{display:flex;width:100%;max-width:540px;background:linear-gradient(180deg,rgba(17,29,59,.94),rgba(7,13,28,.98));border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.bn button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mute);font-size:11.5px;font-weight:700;position:relative}
.bn button em{font-style:normal;font-size:22px;filter:grayscale(.8)}
.bn button.on{color:var(--gold)}.bn button.on em{filter:none;transform:translateY(-3px) scale(1.12)}
.bn button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
body.inq .bn,body.inq #top{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* player cards */
.pc{--c:#9aa7b8;border-radius:14px;padding:3px;background:linear-gradient(160deg,var(--c),#1a2440 60%,var(--c));aspect-ratio:3/4.2;position:relative;box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.pc.r1{--c:#2ee6ff}.pc.r2{--c:#b46bff}.pc.r3{--c:#f2c14e}
.pc.r4{background:linear-gradient(120deg,#ff7ad9,#2ee6ff,#f2c14e,#7dff9b,#ff7ad9);background-size:300% 300%;animation:holo 7s linear infinite;box-shadow:0 0 22px #ff7ad966}
.pc.r3{animation:none}
@keyframes holo{0%{background-position:0 50%}100%{background-position:300% 50%}}
.pc-in{height:100%;border-radius:11px;background:linear-gradient(180deg,#16264a,#0a1226);display:flex;flex-direction:column;overflow:hidden;position:relative}
.pc-top{position:absolute;top:5px;right:7px;z-index:2;text-align:center;line-height:1.1;text-shadow:0 1px 3px #000}
.pc-top b{display:block;font-size:20px;color:var(--c);font-family:Impact,'Arial Black',sans-serif}.pc-top span{font-size:9.5px;font-weight:800}
.pc-art{flex:1;min-height:0}.pc-art svg{width:100%;height:100%;display:block}
.pc-name{font-weight:900;text-align:center;font-size:12.5px;padding:3px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-sub{text-align:center;font-size:9.5px;color:var(--mute);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-rar{text-align:center;font-size:9.5px;font-weight:900;color:var(--c);padding:1px 0 4px}
.pc.lock{--c:#33427a;filter:grayscale(1);opacity:.55}.pc.lock .pc-art{display:grid;place-items:center;font-size:34px;color:#4a5b94}
.pc .cnt{position:absolute;bottom:22px;left:6px;z-index:3;background:#000a;border-radius:10px;padding:0 6px;font-size:11px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{flex:none;padding:5px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700}.chips button.on{background:var(--gold);color:#1b1400;border-color:var(--gold)}
/* levels */
.lv{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;position:relative}
.lv small{font-size:10px;letter-spacing:1px;color:var(--gold);min-height:13px}
.lv.cur{border-color:var(--gold);box-shadow:0 0 14px #f2c14e66}.lv.lk{opacity:.4}.lv.lk::after{content:"🔒";position:absolute;font-size:11px;top:3px;right:5px}
.tier{display:flex;align-items:center;gap:8px;margin:18px 0 8px}.tier b{font-size:15px}.tier i{flex:1;height:1px;background:var(--line)}
/* quiz */
.qh{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.x{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.dots{display:flex;gap:5px;flex:1;justify-content:center}.dots i{width:22px;height:6px;border-radius:4px;background:#22335f}.dots i.d{background:var(--grass)}.dots i.c{background:var(--gold)}.dots i.b{background:var(--bad)}
.sc{font-weight:900;color:var(--gold);min-width:56px;text-align:left;white-space:nowrap}
.tbar{height:8px;border-radius:8px;background:#1b2b56;overflow:hidden;position:relative}.tbar u{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--grass),var(--neon));transition:width .1s linear}.tbar u.low{background:linear-gradient(90deg,var(--bad),#ff9a5a)}
.qm{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.stage{border-radius:22px;background:radial-gradient(120% 90% at 50% 0,#243a73,#0c1630);border:1px solid var(--line);padding:12px;margin:6px 0 10px;position:relative;overflow:hidden}
.stage.flash{animation:flash .7s}
@keyframes flash{0%{box-shadow:0 0 0 0 #3be08a}40%{box-shadow:0 0 40px 8px #3be08a99}100%{box-shadow:0 0 0 0 #3be08a00}}
.stage.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.portrait{width:170px;height:204px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #000a;transition:filter .5s}
.portrait svg{width:100%;height:100%;display:block}
.tags{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tags span{background:#ffffff14;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px}.info dt{color:var(--mute)}.info dd{margin:0;font-weight:800}
.clues{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;min-height:6px}.clues span{background:#2ee6ff1c;border:1px solid #2ee6ff66;border-radius:12px;padding:2px 11px;font-size:12.5px;font-weight:700;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:62px;border-radius:15px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);font-weight:800;font-size:15px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.opt small{font-size:10.5px;color:var(--mute);direction:ltr;font-weight:600}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.good{background:linear-gradient(160deg,#1fa862,#0e6b3a);border-color:#6dffb0}.opt.bad{background:linear-gradient(160deg,#a8284a,#5e1126);border-color:var(--bad)}.opt.gone{opacity:.18}
.boost{display:flex;gap:8px;margin-top:12px}.boost button{flex:1;padding:8px 4px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.boost button em{font-style:normal;color:var(--gold);font-size:11.5px}.boost button:disabled{opacity:.35}
.fb{margin-top:12px;border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--panel);animation:pop .25s}
.fb.ok{border-color:var(--ok);background:#0f3d2a}.fb.no{border-color:var(--bad);background:#3d1223}
.fb b{font-size:16px}.fb p{margin:4px 0 10px;font-size:13.5px;color:#d6e2ff}
.stars{font-size:46px;letter-spacing:6px;color:#33427a;text-align:center}.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 0 18px var(--gold);animation:pop .5s backwards}
.big{font-size:44px;font-weight:900;text-align:center;line-height:1.1}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.sum div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.sum b{display:block;font-size:19px;color:var(--gold)}.sum small{color:var(--mute);font-size:11.5px}
.prog{height:9px;border-radius:9px;background:#1b2b56;overflow:hidden}.prog u{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--gold));border-radius:9px}
.btn-s{padding:8px 16px;border-radius:12px;font-weight:900;font-size:13.5px;background:var(--gold);color:#1b1400}.btn-s:disabled{background:#2a3a6b;color:var(--mute)}.btn-s.neon{background:var(--neon)}
.lb{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.lb.me{border-color:var(--gold);background:#3a300f}.lb .rk{width:28px;text-align:center;font-weight:900;color:var(--mute)}.lb:nth-child(-n+3) .rk{color:var(--gold)}
.lb .av{width:36px;height:36px;font-size:19px;border-width:2px}
.ban{background:#2ee6ff14;border:1px dashed #2ee6ff88;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warn{background:#f2c14e14;border:1px dashed #f2c14e88}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.day{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px 4px;text-align:center;font-size:12.5px;font-weight:700}.day.cur{border-color:var(--gold);box-shadow:0 0 14px #f2c14e55}.day.done{opacity:.45}.day em{display:block;font-style:normal;font-size:22px}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#02060ecc}#modal.on{display:flex}
.sheet{width:100%;max-width:540px;max-height:88dvh;overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--deep));border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3:first-child{margin-top:0;font-size:19px}
#modal.full{align-items:center}#modal.full .sheet{border-radius:26px;margin:0 12px}
.flipwrap{display:flex;gap:10px;justify-content:center;margin:16px 0;perspective:900px}
.flip{width:30%;max-width:150px;aspect-ratio:3/4.2;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}.flip.on{transform:rotateY(180deg)}
.flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .ft{transform:rotateY(180deg)}
.flip .bk{border-radius:14px;background:repeating-linear-gradient(45deg,#16264a 0 8px,#1b2f5d 8px 16px);border:3px solid var(--gold);display:grid;place-items:center;font-size:34px;color:var(--gold)}
.dup{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:900;color:var(--gold);z-index:3;text-shadow:0 1px 3px #000}
#toast{position:fixed;top:12px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toast div{background:#0b1430f2;border:1px solid var(--gold);color:var(--ink);padding:8px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 8px 24px #000a;animation:tin .25s,tout .3s 2.4s forwards;max-width:92vw;text-align:center}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--deep);outline:0}
input[type=range]{width:100%;accent-color:var(--gold)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:800}.seg button.on{background:var(--gold);color:#1b1400}
.shopi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}.shopi em{font-style:normal;font-size:28px;width:40px;text-align:center}.shopi div{flex:1}.shopi b{display:block;font-size:14.5px}.shopi small{color:var(--mute);font-size:12px}
.path{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;margin-top:10px}.path span{background:#f2c14e22;border:1px solid #f2c14e66;border-radius:10px;padding:1px 9px;font-size:12.5px;font-weight:800}.path i{font-style:normal;color:var(--gold)}
.fpitch{position:relative;aspect-ratio:3/4;border-radius:20px;border:2px solid #ffffff55;overflow:hidden;background:repeating-linear-gradient(0deg,#0f7a42 0 12.5%,#0c6a38 12.5% 25%);margin-bottom:10px}
.fpitch::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ffffff55}.fpitch::after{content:"";position:absolute;left:35%;right:35%;top:calc(50% - 15%);aspect-ratio:1;border:2px solid #ffffff55;border-radius:50%;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);width:19%;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2}
.slot .sa{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#0b1330;display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--gold)}.slot .sa svg{width:100%;height:100%}.slot .sa.empty{border-style:dashed;background:#00000040}
.slot b{font-size:10.5px;text-shadow:0 1px 3px #000;white-space:nowrap}.slot small{font-size:10px;color:#fff;text-shadow:0 1px 3px #000}
@keyframes sheen{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(260%) skewX(-20deg)}}
.pc-in::after{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:sheen 5s ease-in-out infinite;pointer-events:none}
.pc-in{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -30px 40px rgba(0,0,0,.35)}
.pc{transition:transform .25s}.pc:hover{transform:translateY(-4px) scale(1.03)}
.stage{box-shadow:0 0 40px rgba(46,230,255,.12),inset 0 0 60px rgba(0,0,0,.35)}
.portrait{box-shadow:0 14px 40px #000c,0 0 0 2px rgba(242,193,78,.5),0 0 30px rgba(242,193,78,.25)}
.opt{box-shadow:0 4px 0 #0a1330}.opt.good{box-shadow:0 0 22px #3be08a88}
.tile{box-shadow:0 6px 18px #0006,inset 0 1px 0 #ffffff14}
@media(min-width:900px){body{font-size:17px}.shell{max-width:600px}.bn div{max-width:600px}.shell,.bn div{box-shadow:0 0 80px #2ee6ff14}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function buildCampaign(){const r=rngFrom(1357911),N=PL.length,sorted=PL.slice().sort((a,b)=>a.diff-b.diff||b.ovr-a.ovr),levels=[],tierOf=[],tiers=[];
for(let t=0;t<5;t++){const grp=sorted.filter((_,i)=>Math.floor(i*5/N)===t);let pairs=[];grp.forEach(p=>MODES.forEach(m=>pairs.push([p.id,m])));pairs=shuffle(pairs,r);const from=levels.length+1;
while(pairs.length>=5){const idx=[],used={};for(let i=0;i<pairs.length&&idx.length<5;i++){if(!used[pairs[i][0]]){used[pairs[i][0]]=1;idx.push(i)}}if(idx.length<5)break;levels.push(idx.map(i=>pairs[i]));idx.slice().reverse().forEach(i=>pairs.splice(i,1));tierOf.push(t)}
tiers.push({name:TIER[t],from,to:levels.length})}return{levels,tierOf,tiers}}
const CAMP=buildCampaign(),LV=CAMP.levels.length;

function tone(f,d,type,vol,when,to){const c=ac();if(!c||vol<=0)return;const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}

let PS=[],raf=0;const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(x,y,n){if(RM)return;const c=$('#fx');c.width=innerWidth;c.height=innerHeight;x=x==null?innerWidth/2:x;y=y==null?innerHeight/3:y;const col=['#f2c14e','#2ee6ff','#3be08a','#ff7ad9','#ffffff'];for(let i=0;i<(n||60);i++){const a=Math.random()*6.28,s=3+Math.random()*7;PS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:2+Math.random()*3,c:col[i%5],l:60+Math.random()*30})}if(!raf)raf=requestAnimationFrame(fxLoop)}
function fxLoop(){const c=$('#fx'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);PS.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.l--;g.globalAlpha=clamp(p.l/30,0,1);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r*1.6,p.r)});PS=PS.filter(p=>p.l>0);if(PS.length)raf=requestAnimationFrame(fxLoop);else{raf=0;g.clearRect(0,0,c.width,c.height)}}

const posOrder=a=>a;
function clueList(p,mode){const en=p.en.replace(/[^A-Za-zÀ-ÿ]/g,''),n=NAT[p.nat],L=[];
const letters=[`نام انگلیسی ${fa(en.length)} حرف دارد`,`حرف اول نام انگلیسی: ${p.en[0]}`,`حرف آخر نام انگلیسی: ${en[en.length-1].toUpperCase()}`];
if(mode==='img')L.push('جایگاه: '+POSN[p.pos],'باشگاه اول: '+p.clubs[0],'آخرین باشگاه: '+p.clubs[p.clubs.length-1]);
else if(mode==='hide')L.push('جایگاه: '+POSN[p.pos],'ملیت: '+n[0],'باشگاه اول: '+p.clubs[0],p.num?'شماره پیراهن: '+fa(p.num):'آخرین باشگاه: '+p.clubs[p.clubs.length-1]);
else if(mode==='stats')L.push('جایگاه: '+POSN[p.pos],'ملیت: '+n[0],'باشگاه اول: '+p.clubs[0]);
else if(mode==='path')L.push('ملیت: '+n[0],p.num?'شماره پیراهن: '+fa(p.num):'جایگاه: '+POSN[p.pos]);
else if(mode==='fact')L.push('جایگاه: '+POSN[p.pos],'ملیت: '+n[0],'باشگاه اول: '+p.clubs[0]);
return L.concat(letters)}
function buildQs(kind,o){let pool,rng,count=o.count||5,qs=[];
if(kind==='level'){const r2=rngFrom(hashStr('L'+o.level)),t=CAMP.tierOf[o.level-1];return CAMP.levels[o.level-1].map(([pid,mode])=>{const p=PM[pid];let ot=shuffle(PL.filter(x=>x.id!==pid),r2);if(t>=1)ot.sort((a,b)=>((b.pos===p.pos)+(t>=3&&b.nat===p.nat))-((a.pos===p.pos)+(t>=3&&a.nat===p.nat)));return{pid,mode,opts:shuffle([pid,...ot.slice(0,3).map(x=>x.id)],r2)}})}
if(kind==='level'){const d=Math.ceil(o.level/LPT);rng=rngFrom(hashStr('L'+o.level));pool=PL.filter(p=>p.diff>=Math.max(1,d-1)&&p.diff<=Math.min(5,d+1))}
else if(kind==='daily'){rng=rngFrom(hashStr('D'+today()));pool=PL.filter(p=>p.diff<=4)}
else if(kind==='seed'){rng=rngFrom(hashStr('C'+o.code));pool=PL.filter(p=>p.diff<=4)}
else if(kind==='versus'){rng=Math.random;pool=PL.filter(p=>p.diff<=3)}
else{rng=Math.random;const mx=Math.min(5,2+Math.floor(lvlOf(S.xp)/4));pool=o.pool||PL.filter(p=>p.diff<=mx)}
const pick=shuffle(pool,rng).slice(0,count);
pick.forEach((p,j)=>{let mode=kind==='level'?MODES[(o.level-1+j)%4]:(kind==='daily'||kind==='seed')?MODES[j%MODES.length]:kind==='quick'?(o.mode||MODES[Math.floor(rng()*MODES.length)]):MODES[Math.floor(rng()*MODES.length)];
let others=shuffle(PL.filter(x=>x.id!==p.id),rng);if(p.diff>=3||(o.level&&o.level>40))others.sort((a,b)=>(b.pos===p.pos)-(a.pos===p.pos));
qs.push({pid:p.id,mode,opts:shuffle([p.id,...others.slice(0,3).map(x=>x.id)],rng)})});return qs}
function startQuiz(kind,o){o=o||{};const qs=buildQs(kind,o);Q={kind,level:o.level,mode:o.mode,qs,i:0,ok:0,score:0,streak:0,earn:{c:0,x:0},players:o.players||null,turn:0,room:o.room,code:o.code};
Q.practice=!!o.practice;
closeModal();UI.view='quiz';beginQ();render();window.scrollTo(0,0)}
function curQ(){return Q.qs[Q.i]}
function beginQ(){const q=curQ(),p=PM[q.pid];Q.st=Q.kind==='versus'?'ready':'play';Q.bad=[];Q.rm=[];Q.cl=0;Q.blur=0;Q.retried=false;Q.hints=0;Q.fb=null;Q.counted=false;
Q.tmax=Q.kind==='versus'?15:Math.max(12,26-2*p.diff);Q.t=Q.tmax;Q.anim='';renderMain();if(Q.st==='play')timerRun()}
let TM=null;
function timerStop(){clearInterval(TM);TM=null}
function timerRun(){timerStop();TM=setInterval(()=>{Q.t-=.1;const f=$('#tf'),tt=$('#tt');if(f){f.style.width=Math.max(0,Q.t/Q.tmax*100)+'%';f.classList.toggle('low',Q.t<5)}if(tt)tt.textContent=fa(Math.ceil(Math.max(0,Q.t)));if(Q.t<=3&&Q.t>0&&Math.abs(Q.t-Math.round(Q.t))<.06)sfx.tick();if(Q.t<=0){timerStop();timeout()}},100)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){timerStop();musicStop()}else{if(Q&&UI.view==='quiz'&&Q.st==='play')timerRun();musicStart()}});
function countAns(ok){if(Q.counted)return;Q.counted=true;if(Q.kind==='versus')return;S.stats.answered++;const q=curQ(),ms=S.ms[q.mode]||(S.ms[q.mode]=[0,0]);ms[1]++;if(ok){ms[0]++;if(S.miss[q.pid]){S.miss[q.pid]--;if(!S.miss[q.pid])delete S.miss[q.pid]}}else S.miss[q.pid]=(S.miss[q.pid]||0)+1}
function vib(x){try{navigator.vibrate&&navigator.vibrate(x)}catch(e){}}
function answer(id){if(!Q||Q.st!=='play'||Q.bad.includes(id)||Q.rm.includes(id))return;timerStop();const q=curQ(),p=PM[q.pid];if(id===q.pid)onRight(p);else onWrong(id)}
function onRight(p){Q.st='right';sfx.ok();vib(25);Q.anim='flash';
const vs=Q.kind==='versus';let pts=100+Math.round(Math.max(0,Q.t)*(vs?10:4))+(vs?0:Math.min(Q.streak,5)*10)-Q.hints*15;if(Q.retried)pts=Math.round(pts/2);pts=Math.max(20,pts);
if(vs){Q.players[Q.turn].score+=pts;Q.players[Q.turn].ok++;Q.fb={pts}}
else{Q.score+=pts;Q.ok++;Q.streak=Q.retried?0:Q.streak+1;countAns(true);S.stats.correct++;S.ident[p.id]=1;if(p.diff>=3){S.stats.hard++;track('hard')}track('correct');
const c=3+p.diff*(Q.retried?1:2),x=8+p.diff*3;S.coins+=c;Q.earn.c+=c;Q.earn.x+=x;addXp(x);Q.fb={pts,c,x};save();updateTop()}
renderMain();burst(innerWidth/2,innerHeight*.35,26)}
function onWrong(id){sfx.bad();vib([40,40,40]);Q.anim='shake';Q.streak=0;Q.bad.push(id);Q.fb={msg:'پاسخ درست نبود.'};
if(Q.kind==='versus'){Q.st='reveal';Q.fb.pts=0}else Q.st='wrong';renderMain()}
function timeout(){if(Q.st!=='play')return;sfx.bad();Q.streak=0;Q.anim='shake';Q.fb={msg:'زمان تمام شد.'};Q.st=Q.kind==='versus'?'reveal':'wrong';renderMain()}
function showAnswer(){if(!Q||Q.st!=='wrong')return;Q.st='reveal';countAns(false);Q.anim='';renderMain()}
function retry(){if(Q.st!=='wrong')return;if(S.coins<15){toast('سکه کافی نداری. «نمایش پاسخ» را بزن.');return}S.coins-=15;save();updateTop();Q.retried=true;Q.st='play';Q.t=Q.tmax;Q.anim='';renderMain();timerRun()}
function boost(t){if(!Q||Q.st!=='play'||Q.kind==='versus')return;const q=curQ(),p=PM[q.pid],cost={hint:15,remove:20,reveal:15}[t];
let can=true;
if(t==='hint'){if(Q.cl>=clueList(p,q.mode).length){toast('سرنخ دیگری باقی نمانده');can=false}}
if(t==='remove'){const w=q.opts.filter(o=>o!==q.pid&&!Q.rm.includes(o)&&!Q.bad.includes(o));if(w.length<=1){toast('فقط یک گزینهٔ اشتباه مانده');can=false}}
if(t==='reveal'){if(q.mode!=='hide'||Q.blur>=3){toast('تصویر کاملاً واضح است');can=false}}
if(!can)return;
if(S.inv[t]>0)S.inv[t]--;else if(S.coins>=cost)S.coins-=cost;else{toast('سکه کافی نداری. از فروشگاه بخر.');return}
Q.hints++;sfx.coin();
if(t==='hint')Q.cl++;
if(t==='remove'){const w=q.opts.filter(o=>o!==q.pid&&!Q.rm.includes(o)&&!Q.bad.includes(o));Q.rm.push(w[Math.floor(Math.random()*w.length)])}
if(t==='reveal')Q.blur++;
save();updateTop();renderMain()}
function nextQ(){if(!Q)return;if(Q.kind==='versus'){Q.turn++;if(Q.turn>=Q.players.length){Q.turn=0;Q.i++}}else Q.i++;if(Q.i>=Q.qs.length)finish();else beginQ()}
function startTurn(){Q.st='play';Q.t=Q.tmax;renderMain();timerRun()}
function finish(){timerStop();const n=Q.qs.length,res={kind:Q.kind,ok:Q.ok,n,score:Q.score,earn:{c:Q.earn.c,x:Q.earn.x},level:Q.level};S.stats.games++;
if(Q.kind==='level'){const L=Q.level,ratio=Q.ok/n,passed=ratio>=.6,stars=ratio>=1?3:ratio>=.8?2:ratio>=.6?1:0;res.passed=passed;res.stars=stars;
if(passed){const first=!(S.cl[L]>0);S.cl[L]=Math.max(S.cl[L]||0,stars);const c=30+L+stars*10,x=40+L;S.coins+=c;res.earn.c+=c;res.earn.x+=x;addXp(x);if(first&&L%10===0){S.gems+=5;res.gem=5}else if(first&&stars===3){S.gems+=1;res.gem=1}track('levels');hist('تکمیل مرحله '+fa(L)+' با '+fa(stars)+' ستاره')}}
else if(Q.kind==='daily'){res.passed=true;if(S.daily.played!==today()){S.daily.played=today();const c=30+Q.ok*10,g=Q.ok>=4?2:1,x=40+Q.ok*10;S.coins+=c;S.gems+=g;res.earn.c+=c;res.earn.x+=x;res.gem=g;addXp(x);S.stats.daily++;hist('مسابقه روزانه: '+fa(Q.ok)+' از '+fa(n))}else res.replay=true}
else if(Q.kind==='seed'){res.passed=true;res.code=Q.code;if(!S.codes[Q.code]){S.codes[Q.code]=1;const c=10+Q.ok*5;S.coins+=c;res.earn.c+=c}}
else if(Q.kind==='versus'){res.rank=Q.players.slice().sort((a,b)=>b.score-a.score);res.passed=true;S.coins+=20;res.earn.c+=20;res.earn.x+=30;addXp(30)}
else res.passed=Q.ok>=Math.ceil(n/2);
checkBadges();save();UI.res=res;UI.view='result';render();window.scrollTo(0,0);if(res.passed){sfx.win();burst(null,null,90)}else sfx.bad()}

function stageHTML(q,p,clear,blur){const n=NAT[p.nat];
let stage='';
if(q.mode==='img')stage=`<div class="portrait">${portrait(p)}</div><div class="tags"><span>${n[1]} ${n[0]}</span>${p.num?`<span>شماره ${fa(p.num)}</span>`:''}</div>`;
else if(q.mode==='hide'){const b=clear?0:[13,8,4,0][blur],br=clear?1:[.6,.75,.9,1][blur];stage=`<div class="portrait" style="filter:blur(${b}px) brightness(${br})">${portrait(p)}</div><div class="path">${p.clubs.map(c=>`<span>${c}</span>`).join('<i>‹</i>')}</div><div class="tags"><span>${n[1]} ${n[0]} — ${POSN[p.pos]}</span></div>`}
else if(q.mode==='info')stage=`<dl class="info"><dt>جایگاه</dt><dd>${POSN[p.pos]}</dd><dt>ملیت</dt><dd>${n[1]} ${n[0]}</dd><dt>باشگاه‌ها</dt><dd>${p.clubs.join('، ')}</dd>${p.num?`<dt>شماره پیراهن</dt><dd>${fa(p.num)}</dd>`:''}<dt>افتخار شاخص</dt><dd>${p.f[0]}</dd></dl>`;

save();toast('خرید انجام شد');render()},
claim:v=>{const m=MISSIONS().find(x=>x.id===v);if(!m||m.done()||m.cur()<m.max)return;if(m.d)S.m.claimed[v]=1;else S.cp[v]=1;earn(m.r);sfx.win();burst();toast('جایزه دریافت شد: '+rtxt(m.r));renderMain()},
claimDaily:()=>{if(!dailyAvail())return;S.daily.streak=S.daily.last===yesterday()?S.daily.streak+1:1;S.daily.last=today();const r=R7[(S.daily.streak-1)%7];earn({coins:r.c,gems:r.g,xp:r.x});sfx.win();burst();toast('جایزهٔ روز '+fa(S.daily.streak)+': '+r.t);hist('جایزه روزانه، روز '+fa(S.daily.streak));render();if(r.p)setTimeout(()=>{S.gems+=8;openPack('gold')},500)},
setAv:v=>{S.avatar=v;S.photo=null;save();render()},setFr:v=>{S.frame=v;save();render()},setTh:v=>{S.theme=v;save();render()},
pimg:v=>{UI.pid=v;$('#pfile').click()},pimgDel:v=>{delete S.pimg[v];save();cardDetail(v);render()},photo:()=>$('#file').click(),photoDel:()=>{S.photo=null;save();render()},
musicT:()=>{S.set.musicOn=!S.set.musicOn;if(S.set.musicOn)musicStart();else musicStop();save();renderMain()},
resetAsk:()=>openModal(`<h3>بازنشانی همه چیز؟</h3><p class="muted">سکه، کارت‌ها، مرحله‌ها و تنظیمات پاک می‌شوند و قابل بازگشت نیست.</p><div class="grid2"><button class="ghost" data-a="closeM">انصراف</button><button class="cta sm" data-a="resetDo" style="background:var(--bad);color:#fff;box-shadow:none">بازنشانی</button></div>`),
closeM:()=>closeModal(),
resetDo:()=>{try{localStorage.removeItem(KEY)}catch(e){}memSave=null;S=defaults();closeModal();Q=null;go('home');toast('پیشرفت بازنشانی شد')},
roomNew:()=>{UI.pn=2;roomSheet()},pn:v=>{UI.pn=+v;roomSheet()},
roomGo:()=>{let names=[...document.querySelectorAll('[data-pn]')].map((e,i)=>e.value.trim()||'بازیکن '+fa(i+1));if(names.length<2)names=Array.from({length:UI.pn||2},(_,i)=>i===0?S.name:'بازیکن '+fa(i+1));const code='FL-'+Math.random().toString(36).slice(2,6).toUpperCase();toast('کد اتاق (فقط روی این دستگاه): '+code);startRoom(names,code)},
roomJoin:()=>openModal(`<h3>پیوستن با کد</h3><p class="muted">کدی که قبلاً روی همین دستگاه ساخته‌ای را وارد کن تا همان بازیکن‌ها دوباره بازی کنند. اتاق‌های دستگاه‌های دیگر بدون سرور قابل دسترسی نیستند.</p><input type="text" id="rc" placeholder="FL-XXXX" maxlength="7" style="direction:ltr;text-align:center;margin-bottom:10px"><button class="cta" data-a="roomJoinGo">پیوستن</button>`),
roomJoinGo:()=>{const c=($('#rc').value||'').trim().toUpperCase();if(S.rooms[c])startRoom(S.rooms[c],c);else toast('این کد روی این دستگاه ساخته نشده است. مسابقهٔ آنلاین واقعی نیازمند سرور است.')}};
document.addEventListener('click',e=>{if(e.target.id==='modal'){if(!$('#modal').classList.contains('full')){closeModal();if(Q&&UI.view==='quiz'&&Q.st==='play'&&!TM)timerRun()}return}
const t=e.target.closest('[data-a]');if(!t||t.disabled)return;ac();musicStart();if(!['opt','flip'].includes(t.dataset.a))sfx.tap();const f=ACT[t.dataset.a];if(f)f(t.dataset.v,t,e)});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;if(k==='sfx'||k==='music'){S.set[k]=e.target.value/100;save();if(k==='sfx')sfx.tap()}});
document.addEventListener('change',e=>{if(e.target.dataset.in==='name'){S.name=(e.target.value.trim()||'بازیکن جدید').slice(0,16);save();updateTop()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=112;const g=c.getContext('2d'),s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,112,112);S.photo=c.toDataURL('image/jpeg',.8);save();render();toast('عکس پروفایل ذخیره شد')};im.onerror=()=>toast('این فایل تصویر معتبری نیست');im.src=rd.result};rd.readAsDataURL(f);e.target.value=''});

$('#pfile').addEventListener('change',e=>{const f=e.target.files[0],id=UI.pid;if(!f||!id)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=160;c.height=192;const g=c.getContext('2d'),r=Math.max(160/im.width,192/im.height),w=im.width*r,h=im.height*r;g.drawImage(im,(160-w)/2,0,w,h);S.pimg[id]=c.toDataURL('image/jpeg',.82);save();toast('عکس روی کارت و مرحله‌ها اعمال شد');cardDetail(id);render()};im.onerror=()=>toast('فایل تصویر معتبر نیست');im.src=rd.result};rd.readAsDataURL(f);e.target.value=''});

/* ============ رقابت محلی (بدون اینترنت) ============ */
VIEWS.online=function(){return backBar('رقابت با دوستان','play')+`<p class="muted" style="margin-top:0">بدون اینترنت: یا چند نفر روی یک گوشی به‌نوبت بازی می‌کنید، یا یک کد چالش می‌سازید و دوستتان همان سؤال‌ها را روی گوشی خودش بازی می‌کند.</p>`+`<h3>چالش با کد</h3><p class="muted" style="margin-top:0">کد را به دوستت بگو؛ هر دو همان ۵ سؤال را جداگانه بازی می‌کنید و نتیجه را مقایسه می‌کنید.</p><div class="grid2"><button class="cta sm" data-a="chNew">ساخت چالش</button><button class="ghost" data-a="chJoin">ورود با کد</button></div><h3>روی یک گوشی</h3><button class="cta alt" data-a="roomNew">ساخت اتاق ۲ تا ۴ نفره</button><button class="ghost" style="margin-top:10px" data-a="roomJoin">پیوستن با کد اتاق</button>`};

/* ============ شروع ============ */
(function init(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
ensureDaily();checkBadges();save();render();
if(!S.seen)openModal(`<h3>خوش آمدی</h3><div class="shopi"><em>🎯</em><div><b>مرحله‌ها</b><small>هر مرحله ۵ سؤال دارد و هیچ سؤالی تکراری نیست؛ حداقل ۶۰٪ درست یعنی عبور.</small></div></div><div class="shopi"><em>💡</em><div><b>کمکی‌ها</b><small>سرنخ، حذف گزینه و آشکارسازی تصویر؛ هر کدام کمی از امتیاز می‌کاهند.</small></div></div><div class="shopi"><em>🔥</em><div><b>کومبو</b><small>پاسخ‌های درست پشت‌سرهم امتیاز بیشتری می‌دهند.</small></div></div><div class="shopi"><em>🃏</em><div><b>کارت‌ها</b><small>با سکه بسته بخر و برای هر کارت عکس بازیکن بگذار.</small></div></div><button class="cta" data-a="seen">شروع</button>`)})();
</script>
